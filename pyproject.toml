[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriexciting"
version = "0.1.0"
description = "**VeriExCite** is a Python tool designed to help you verify the existence of citations in academic papers (PDF format). It extracts the bibliography section from a PDF, parses individual references, and then checks their validity against Crossref and Google Scholar databases."
readme = "README.md"
authors = [
  { name = "Yikang Wang", email = "yikang.wang.21@ucl.ac.uk" },
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "google-genai>=2.16.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "protobuf>=5.29.3",
    "pydantic>=2.10.6",
    "pypdf2>=3.0.1",
    "rapidfuzz>=3.0.0",
    "requests>=2.32.3",
    "scholarly>=1.7.11",
    "streamlit>=1.42.0",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "unidecode>=1.3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.11.6",
    "watchdog>=4.0.0",
]

[tool.setuptools]
py-modules = ["veriexcite", "streamlit_app"]
